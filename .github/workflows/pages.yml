# Deploys the repository root to GitHub Pages. Requires: repository Settings > Pages > Source = "GitHub Actions"
# (and a public repository or a plan that allows Pages on private repositories).
name: Deploy Tour Life to GitHub Pages
on:
  push:
    branches: [main, master]
    paths: ["**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
